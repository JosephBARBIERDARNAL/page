[package]
name = "mai-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mai"
path = "src/main.rs"

[[bin]]
name = "verapdf-diff"
path = "src/bin/verapdf-diff.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
mai-validation = { path = "../mai-validation" }
serde = "1"
serde_json = "1"
