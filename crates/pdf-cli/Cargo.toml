[package]
name = "pdf-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pdf"
path = "src/main.rs"

[[bin]]
name = "verapdf-diff"
path = "src/bin/verapdf-diff.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
pdf-validation = { path = "../pdf-validation" }
serde = "1"
serde_json = "1"
