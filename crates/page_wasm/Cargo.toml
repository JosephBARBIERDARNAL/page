[package]
name = "page-validation-wasm"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for page, a fast and lightweight PDF accessibility and compliance checker."
repository.workspace = true
license.workspace = true
keywords = ["accessibility", "pdf", "wasm", "webassembly"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
page_validation = { path = "../page_validation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
