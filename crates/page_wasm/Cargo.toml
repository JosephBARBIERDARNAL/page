[package]
name = "page-validation-wasm"
version = "0.6.0"
edition = "2024"
rust-version = "1.88.0"
description = "WebAssembly bindings for page, a fast and lightweight PDF accessibility and compliance checker."
repository = "https://github.com/JosephBARBIERDARNAL/page-wasm"
license = "MIT"
keywords = ["accessibility", "pdf", "wasm", "webassembly"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
page_validation = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
codegen-units = 1
