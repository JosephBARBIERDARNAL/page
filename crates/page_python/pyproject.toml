[project]
name = "page-validation"
version = "0.6.0"
description = "Python bindings to page, a fast and lightweight PDF accessibility and compliance checker."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Joseph Barbier", email = "joseph@ysunflower.com" },
]
keywords = ["accessibility", "page", "pdf", "validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
]
dependencies = []

[project.urls]
Documentation = "https://josephbarbierdarnal.github.io/page/api/python/"
Homepage = "https://josephbarbierdarnal.github.io/page/api/python/"
Issues = "https://github.com/josephbarbierdarnal/page-python/issues"
Repository = "https://github.com/josephbarbierdarnal/page-python"

[dependency-groups]
dev = [
  "coverage>=7.9.1",
  "genbadge>=1.1.2",
  "maturin>=1.14.1",
  "prek>=0.3.2",
  "pyrefly>=1.2.0",
  "pytest>=8.3.5",
  "ruff>=0.11.13",
  "ty>=0.0.15",
]

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "page._page"
python-source = "."

[tool.uv.sources]
page = { workspace = true }
