[package]
name = "tag-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tag"
path = "src/main.rs"

[[bin]]
name = "verapdf-diff"
path = "src/bin/verapdf-diff.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = "1"
serde_json = "1"
tag-validation = { path = "../tag-validation" }
