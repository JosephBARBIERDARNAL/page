[package]
name = "page_validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A fast PDF accessibility and conformance checker."
documentation = "https://josephbarbierdarnal.github.io/page/"
readme = "../../README.md"
homepage = "https://josephbarbierdarnal.github.io/page/"
repository = "https://github.com/josephbarbierdarnal/page"
license = "MIT AND BSD-3-Clause AND Apache-2.0"
keywords = ["PDF", "accessibility", "pdf", "validation", "verapdf"]
exclude = ["/tests/"]

[dependencies]
chrono = "0.4"
lopdf = "0.45.0"
read-fonts = "0.45.0"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
sxd-xpath = "0.4.2"
thiserror = "2"
unicode-properties = "0.1.4"

[dev-dependencies]
serde_json = "1"
sha2 = "0.11"

[lints]
workspace = true
