[package]
name = "tag_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tag"
path = "src/main.rs"

[[bin]]
name = "verapdf-diff"
path = "src/bin/verapdf-diff.rs"

[[bin]]
name = "verapdf-bench"
path = "src/bin/verapdf-bench.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = "1"
serde_json = "1"
tag_validation = { path = "../tag_validation" }
