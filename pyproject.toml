[project]
name = "page-validation"
dynamic = ["version"]
description = "Python bindings to page, a fast and lightweight PDF accessibility and compliance checker."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Joseph Barbier", email = "joseph@ysunflower.com" },
]
keywords = ["accessibility", "page", "pdf", "validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
]
dependencies = []

[project.urls]
Documentation = "https://josephbarbierdarnal.github.io/page/api/python/"
Homepage = "https://josephbarbierdarnal.github.io/page/api/python/"
Issues = "https://github.com/josephbarbierdarnal/page/issues"
Repository = "https://github.com/josephbarbierdarnal/page"

[dependency-groups]
dev = [
  "coverage>=7.9.1",
  "genbadge>=1.1.2",
  "maturin>=1.14.1",
  "prek>=0.3.2",
  "pyrefly>=1.2.0",
  "pytest>=8.3.5",
  "ruff>=0.11.13",
  "ty>=0.0.15",
]

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/page_python/Cargo.toml"
module-name = "page._page"
python-source = "crates/page_python"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/page_python/Cargo.toml" },
  { file = "crates/page_python/src/**/*.rs" },
  { file = "crates/page_validation/Cargo.toml" },
  { file = "crates/page_validation/src/**/*" },
]

[tool.pytest.ini_options]
testpaths = ["crates/page_python/tests"]

[tool.ruff]
include = ["crates/page_python/**/*.py", "crates/page_python/**/*.pyi"]
target-version = "py310"

[tool.ty.src]
include = ["crates/page_python"]

[tool.pyrefly]
project-includes = ["crates/page_python/**/*.py", "crates/page_python/**/*.pyi"]
search-path = ["crates/page_python"]
