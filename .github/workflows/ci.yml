name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  verapdf:
    name: veraPDF 1.28.2 differential
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned veraPDF
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/verapdf-installer.zip \
            https://software.verapdf.org/releases/1.28/verapdf-greenfield-1.28.2-installer.zip
          echo "d1693a5f0bf0997180f6d97e8a5568b0cf39e27eee338d439c8adb58435c1e89  /tmp/verapdf-installer.zip" \
            | sha256sum --check
          unzip -q /tmp/verapdf-installer.zip -d /tmp/verapdf-installer
          /tmp/verapdf-installer/verapdf-greenfield-1.28.2/verapdf-install \
            "$GITHUB_WORKSPACE/.github/verapdf-auto-install.xml"
          /tmp/verapdf/verapdf --version

      - name: Compare with veraPDF
        env:
          VERAPDF_BIN: /tmp/verapdf/verapdf
        run: cargo test -p tag_validation --test verapdf_diff -- --nocapture
