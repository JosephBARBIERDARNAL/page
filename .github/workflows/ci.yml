name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pdfa1b_release_gate:
        description: Require the PDF/A-1B completion gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Generate PDF fixtures
        run: just typst

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Check PDF/A-1B coverage inventory
        run: just coverage

  verapdf:
    name: veraPDF 1.28.2 differential
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Generate PDF fixtures
        run: just typst

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned veraPDF
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/verapdf-installer.zip \
            https://software.verapdf.org/releases/1.28/verapdf-greenfield-1.28.2-installer.zip
          echo "d1693a5f0bf0997180f6d97e8a5568b0cf39e27eee338d439c8adb58435c1e89  /tmp/verapdf-installer.zip" \
            | sha256sum --check
          unzip -q /tmp/verapdf-installer.zip -d /tmp/verapdf-installer
          /tmp/verapdf-installer/verapdf-greenfield-1.28.2/verapdf-install \
            "$GITHUB_WORKSPACE/.github/verapdf-auto-install.xml"
          /tmp/verapdf/verapdf --version

      - name: Compare with veraPDF
        env:
          VERAPDF_BIN: /tmp/verapdf/verapdf
        run: just verapdf

      - name: Enforce PDF/A-1B release completion
        if: ${{ inputs.pdfa1b_release_gate }}
        env:
          VERAPDF_BIN: /tmp/verapdf/verapdf
        run: just pdfa1b-release-gate
