name: veraPDF test corpus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verapdf:
    name: veraPDF differential and corpus gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Generate PDF fixtures
        run: just typst

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned veraPDF
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/verapdf-installer.zip \
            https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.2-installer.zip
          echo "6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838  /tmp/verapdf-installer.zip" \
            | sha256sum --check
          unzip -q /tmp/verapdf-installer.zip -d /tmp/verapdf-installer
          /tmp/verapdf-installer/verapdf-greenfield-1.30.2/verapdf-install \
            "$GITHUB_WORKSPACE/.github/verapdf-auto-install.xml"
          /tmp/verapdf/verapdf --version

      - name: Enforce all implemented PDF/A and PDF/UA profile coverage
        env:
          VERAPDF_BIN: /tmp/verapdf/verapdf
        run: just pdfa-release-gate

      - name: Run page against the veraPDF corpus
        run: just verapdf-corpus
