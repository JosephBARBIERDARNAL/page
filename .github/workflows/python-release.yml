name: Python | Release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the shared release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/check-release-version.sh "$RELEASE_TAG"

  build:
    needs: version
    uses: ./.github/workflows/python-build.yml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment:
      name: pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Attest distributions
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish distributions
        run: uv publish --trusted-publishing always dist/*
