[project]
site_name = "page"
repo_url = "https://github.com/josephbarbierdarnal/page"
site_url = "https://josephbarbierdarnal.github.io/page/"
site_description = "PDF/A and PDF/UA validation engine"
site_author = "Joseph Barbier"
extra_css = ["stylesheets/style.css", "javascripts/demo/demo.css"]
extra_javascript = [
  { path = "javascripts/demo/demo.js", type = "module" },
]
nav = [
  { "Home" = "index.md" },
  { "Demo" = "demo.md" },
  { "Installation" = "installation.md" },
  { "Usage" = [
    { "CLI" = "api/cli.md" },
    { "Rust" = "api/rust.md" },
    { "Python" = "api/python.md" },
    { "WebAssembly" = "api/wasm.md" },
  ] },
  { "Benchmark" = "benchmark.md" },
  { "Contributing" = [
    { "Contributing" = "contributing/index.md" },
    { "Local set up" = "contributing/local-set-up.md" },
    { "Project overview" = "contributing/project-internals-overview.md" },
    { "Code of conduct" = "contributing/code-of-conduct.md" },
  ] },
  { "About" = "about.md" },
]

[project.theme]
logo = "images/logo-on-light.svg"
language = "en"
custom_dir = "docs/overrides"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "navigation.prune",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
