[project]
site_name = "page"
repo_url = "https://github.com/josephbarbierdarnal/page"
site_url = "https://josephbarbierdarnal.github.io/page/"
site_description = "PDF/A and PDF/UA validation engine"
site_author = "Joseph Barbier"
extra_css = ["stylesheets/style.css"]
nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = [
    { "CLI" = ["api/cli/quick-start.md"] },
    { "Rust" = [
      { "Quick start" = "api/rust/quick-start.md" },
      { "ValidationReport" = "api/rust/ValidationReport.md" },
      { "SafetyLimits" = "api/rust/SafetyLimits.md" },
      { "validate_bytes_with_profile" = "api/rust/validate_bytes_with_profile.md" },
      { "validate_bytes" = "api/rust/validate_bytes.md" },
      { "validate_file_with_profile" = "api/rust/validate_file_with_profile.md" },
      { "validate_file" = "api/rust/validate_file.md" },
      { "FailureCategory" = "api/rust/FailureCategory.md" },
      { "ValidationCounts" = "api/rust/ValidationCounts.md" },
      { "ValidationError" = "api/rust/ValidationError.md" },
      { "ValidationFailure" = "api/rust/ValidationFailure.md" },
      { "ValidationProfile" = "api/rust/ValidationProfile.md" },
      { "PdfError" = "api/rust/PdfError.md" },
    ] },
  ] },
  { "Reference" = [
    "rules/pdfa-1-rules.md",
    "rules/pdfa-2-3-rules.md",
    "rules/pdfua-1-rules.md",
  ] },
  { "About" = [{ "FAQ" = "about/faq.md" }, { "PDF Format" = "about/pdf-format.md" }] },
]

[project.theme]
logo = "images/logo-on-light.svg"
language = "en"
custom_dir = "docs/overrides"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "navigation.prune",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
