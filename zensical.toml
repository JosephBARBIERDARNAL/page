[project]
site_name = "mai"
repo_url = "https://github.com/JosephBARBIERDARNAL/mai"
site_url = "https://JosephBARBIERDARNAL.github.io/mai/"
site_description = "Bringing interactivity to plotnine"
site_author = "Joseph Barbier"
extra_css = ["stylesheets/style.css"]
extra_javascript = ["javascripts/llms.js"]
nav = [
  { "Home" = "index.md" },
  { "Gallery" = [
    "gallery/index.md",
    "gallery/coal-production.md",
    "gallery/mondrian.md",
    "gallery/europe-co2.md",
    "gallery/area-hover-to-show.md",
    "gallery/south-france-restaurants.md",
    "gallery/climate-vulnerability-co2.md",
    "gallery/household-wealth.md",
    "gallery/mtcars-linked-panels.md"
  ] },
  { "Guides" = [
    "guide/tooltip.md",
    "guide/onclick.md",
    "guide/css.md",
    "guide/javascript.md",
    "guide/zoom.md",
    "guide/effects.md",
    "guide/animation.md",
    "guide/quarto.md",
    "guide/marimo.md",
    "guide/shiny.md",
    "guide/streamlit.md",
    "guide/positron.md",
    "guide/matplotlib.md",
    "guide/troubleshooting.md",
  ] },
  { "API Reference" = [
    "reference/interactive.md",
    "reference/css.md",
    "reference/javascript.md",
    "reference/effects.md",
  ] },
  { "Contributing" = [
    "contributing.md",
    "how-it-works.md",
    "how-to-add-an-example.md",
    "javascript-reference.md"
  ] },
]

[project.theme]
language = "en"
custom_dir = "overrides"
favicon = "images/favicon.png"
logo = "https://github.com/JosephBARBIERDARNAL/static/blob/main/python-libs/mai/image.png?raw=true"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "navigation.prune",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
