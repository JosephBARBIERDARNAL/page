[project]
site_name = "tag"
repo_url = "https://github.com/JosephBARBIERDARNAL/tag"
site_url = "https://JosephBARBIERDARNAL.github.io/tag/"
site_description = "Experimental veraPDF-compliant PDF/A validation, written in Rust"
site_author = "Joseph Barbier"
extra_css = ["stylesheets/style.css"]
nav = [
  { "Home" = "index.md" },
  { "API Reference" = [
    "reference/cli.md",
    "reference/pdfa1b-completion.md",
    "reference/rust-crate.md",
    "reference/python-package.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "navigation.prune",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
